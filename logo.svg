<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="DSH Reviewer Bot logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1F42"/>
      <stop offset="1" stop-color="#0A2C52"/>
    </linearGradient>
    <linearGradient id="ds" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="0.55" stop-color="#1E9FE0"/>
      <stop offset="1" stop-color="#14C7A4"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF0D8"/>
      <stop offset="1" stop-color="#2FE0B6"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.24" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#hi)"/>

  <!-- unified RING: DeepSeek ripple + review lens + four-level trust + plugin notch -->
  <circle cx="120" cy="118" r="90" fill="none" stroke="url(#ds)" stroke-width="9"/>
  <!-- four-level trust nodes on the ring (top = verified/teal) -->
  <circle cx="120" cy="28"  r="6.5" fill="#2FE0B6"/>
  <circle cx="210" cy="118" r="6.5" fill="#2E6BFF"/>
  <circle cx="120" cy="208" r="6.5" fill="#1E9FE0"/>
  <circle cx="30"  cy="118" r="6.5" fill="#19C2B4"/>
  <!-- harness plugin connector tab (lower-right of ring) -->
  <rect x="170" y="179" width="16" height="16" rx="5" fill="#2FE0B6" transform="rotate(45 178 187)"/>

  <!-- SHIELD whose silhouette IS the code brackets </> -->
  <path d="M66 62 L174 62 L188 118 L162 168 L120 190 L78 168 L52 118 Z" fill="url(#ds)"/>
  <path d="M66 62 L174 62 L188 118 L162 168 L120 190 L78 168 L52 118 Z"
        fill="none" stroke="#0A2C52" stroke-opacity="0.18" stroke-width="2"/>

  <!-- judgment check, connected feel through the shield -->
  <path d="M88 122 L108 144 L150 94" fill="none" stroke="url(#check)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
