# Aggregates real dsh-reviewer-bot review runs into dashboard-data.json on the
# gh-pages branch, which the web control panel (control-panel/index.html) fetches
# by default. Triggered after each "DSHRB review" run and manually via dispatch.
#
# No GitHub Pages setup is required: the panel reads the file through
# raw.githubusercontent.com, which sends Access-Control-Allow-Origin: *.

name: Collect dashboard data

on:
  workflow_run:
    workflows: ["DSHRB review"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # push dashboard-data.json to gh-pages
  actions: read     # download the dsh-result-json artifact

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download result-json artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: dsh-result-json
          run-id: ${{ github.event.workflow_run.id }}
          path: incoming

      - name: Aggregate into dashboard-data.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="dashboard-data.json"
          BRANCH="gh-pages"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          export REPO RUN_ID HEAD_BRANCH HEAD_SHA
          export ENVELOPE="null"
          if [ -f "incoming/result-json.json" ]; then
            export ENVELOPE="$(cat incoming/result-json.json)"
          fi
          # ensure gh-pages exists (create from default branch if missing)
          if ! gh api "repos/${REPO}/git/refs/heads/${BRANCH}" >/dev/null 2>&1; then
            DEF_BRANCH="$(gh api "repos/${REPO}" --jq '.default_branch')"
            DEF_SHA="$(gh api "repos/${REPO}/git/refs/heads/${DEF_BRANCH}" --jq '.object.sha')"
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${DEF_SHA}" >/dev/null
          fi
          # fetch existing aggregated file (if any)
          EXISTING='{"schemaVersion":1,"updatedAt":"","runs":[]}'
          if gh api "repos/${REPO}/contents/${FILE}?ref=${BRANCH}" > existing.json 2>/dev/null; then
            CONTENT_B64="$(node -e 'process.stdout.write(require("./existing.json").content||"")')"
            DECODED="$(printf '%s' "$CONTENT_B64" | base64 -d 2>/dev/null || true)"
            [ -n "$DECODED" ] && EXISTING="$DECODED"
          fi
          export EXISTING
          # merge: append this run (with source metadata), dedupe, keep last 150
          node - <<'NODE'
          const fs = require('fs');
          let store; try { store = JSON.parse(process.env.EXISTING); } catch { store = {schemaVersion:1, updatedAt:"", runs:[]}; }
          if (!Array.isArray(store.runs)) store.runs = [];
          let env = null; try { env = JSON.parse(process.env.ENVELOPE); } catch { env = null; }
          if (env && typeof env === "object") {
            env.collectedAt = new Date().toISOString();
            env.sourceBranch = process.env.HEAD_BRANCH || null;
            env.sourceSha = process.env.HEAD_SHA || null;
            env.workflowRunId = process.env.RUN_ID || null;
            const sig = JSON.stringify(env);
            if (!store.runs.some(r => JSON.stringify(r) === sig)) store.runs.push(env);
          }
          const seen = new Set();
          store.runs = store.runs.filter(r => {
            const s = JSON.stringify(r);
            if (seen.has(s)) return false; seen.add(s); return true;
          }).slice(-150);
          store.updatedAt = new Date().toISOString();
          fs.writeFileSync('dashboard-data.json', JSON.stringify(store, null, 2));
          NODE
          CONTENT_B64="$(base64 -w0 dashboard-data.json)"
          SHA=""
          if gh api "repos/${REPO}/contents/${FILE}?ref=${BRANCH}" > meta.json 2>/dev/null; then
            SHA="$(node -e 'process.stdout.write(require("./meta.json").sha||"")')"
          fi
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/${REPO}/contents/${FILE}" \
              -f message="chore(dashboard): aggregate review run" \
              -f content="$CONTENT_B64" -f sha="$SHA" -f branch="$BRANCH" >/dev/null
          else
            gh api -X PUT "repos/${REPO}/contents/${FILE}" \
              -f message="chore(dashboard): aggregate review run" \
              -f content="$CONTENT_B64" -f branch="$BRANCH" >/dev/null
          fi
