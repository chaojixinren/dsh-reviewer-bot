name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build and attach dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Probe
        run: pnpm run probe

      - name: Build bundled entrypoint
        run: pnpm run build:release

      - name: Attach bundled entrypoint to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/index.js
            dist/index.js.map
