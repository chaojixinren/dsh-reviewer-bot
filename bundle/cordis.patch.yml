# Configuration layer contributed by @dshrb/bundle.
#
# Applied when a profile lists this bundle. Plugin rows reference packages by
# NAME (not a relative path) so Node resolution finds the installed code.
#
# Layer order: bundle layers first, then the user's own profile patch — so a
# user override in their profile always wins. One exception by design:
# `allowWrite` must not be raisable from a repository-controlled layer (the
# `.dshrb.yml` / comment layers). The bundle sets the fail-closed default here.
# See docs/05-plugin-composition.md.

- insert:
    # Rule registry must load before packs that inject it; Cordis handles the
    # ordering through reactive coeffects, so this is for human readability.
    - id: dshrb-rule-registry
      name: '@dshrb/rule-registry'
      config:
        minSeverity: minor

    - id: dshrb-rules-baseline
      name: '@dshrb/rules-baseline'

    - id: dshrb-trust-policy
      name: '@dshrb/trust-policy'
      config:
        # Write mode stays off by default: a one-command install must not hand
        # write permission to the model. Raise it only from a layer the repo
        # maintainer controls (Action inputs / the user's own profile patch).
        allowWrite: false

    # Forge registry must provide `forges` before any provider injects it.
    - id: dshrb-forge
      name: '@dshrb/forge'

    - id: dshrb-forge-github
      name: '@dshrb/forge-github'
      config:
        # DSH patch config does NOT expand bare `$VAR`. Use `!!js` so the value
        # is evaluated against the loader scope (`process` / `ctx` in scope).
        token: !!js process.env.FORGE_TOKEN

    - id: dshrb-tool-review
      name: '@dshrb/tool-review'

    - id: dshrb-progress
      name: '@dshrb/progress'

    - id: dshrb-review-runtime
      name: '@dshrb/review-runtime'
      config:
        timeoutMinutes: 25
        # Mirrors trust-policy's `allowWrite` so the two never drift; both are
        # set from the same maintainer-held layer.
        allowWrite: false
        # Read-only diagnostic intent: reads CI failure logs and replies with a
        # root-cause finding. Requires `trusted-read`, never `allow-write`. Set
        # false to disable the auto-diagnose on `check-failed` events and the
        # `@dsr diagnose` command.
        enableDiagnose: true
