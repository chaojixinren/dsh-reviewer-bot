      <rect x="-360" y="-40" width="300" height="460" fill="url(#sweep)" transform="skewX(-18)">
        <animateTransform attributeName="transform" type="translate" values="-200 0; 1700 0; 1700 0" dur="6s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>

    <!-- LEFT: title block -->
    <text x="64" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="3" fill="#7FB6FF" fill-opacity="0.85">DEEPSEEK HARNESS · 原生代码评审插件</text>
    <text x="62" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#FFFFFF">DSH Reviewer Bot</text>
    <line x1="64" y1="178" x2="430" y2="178" stroke="url(#ds)" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" from="0 380" to="380 0" dur="2.2s" fill="freeze"/>
    </line>
    <text x="64" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#CFE6FF" fill-opacity="0.9">让 AI 在每次提交里给出可信的代码评审</text>

    
    <g>
      <rect x="64" y="300" width="572" height="58" rx="29" fill="#0E2B50" fill-opacity="0.92" stroke="#2E6BFF" stroke-opacity="0.45" stroke-width="1.5"/>
      <!-- cell 1: cross-platform (3 nodes) -->
      <g stroke="#7DF0D8" stroke-width="2.6" fill="#0E2B50">
        <line x1="104" y1="329" x2="120" y2="319"/><line x1="104" y1="329" x2="120" y2="339"/>
        <circle cx="104" cy="329" r="5.5" stroke="#2E6BFF"/>
        <circle cx="120" cy="319" r="5.5" stroke="#14C7A4"/><circle cx="120" cy="339" r="5.5" stroke="#14C7A4"/>
      </g>
      <text x="134" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#DCEBFF">跨平台评审</text>
      <!-- cell 2: pluggable rules (puzzle) -->
      <g transform="translate(250 320)">
        <path d="M0 0 h18 a6 6 0 1 1 12 0 h6 v18 h-8 v-9 h-9 v9 h-8 a6 6 0 1 1 0 -12 h8 z"
              fill="#0E2B50" stroke="#1E9FE0" stroke-width="2.4" stroke-linejoin="round"/>
      </g>
      <text x="296" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#DCEBFF">规则可插拔</text>
      <!-- cell 3: local replay (loop arrow) -->
      <g transform="translate(404 312)">
        <path d="M20 4 a20 20 0 1 0 4 12" fill="none" stroke="#19C2B4" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M24 2 l-2 12 l11 -3 z" fill="#19C2B4"/>
      </g>
      <text x="444" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#DCEBFF">本地重放</text>
      <!-- cell 4: four-level trust (bars) -->
      <g transform="translate(548 316)">
        <rect x="0"  y="6"  width="9" height="14" rx="2.5" fill="#2E6BFF"/>
        <rect x="12" y="2"  width="9" height="18" rx="2.5" fill="#1E9FE0"/>
        <rect x="24" y="-2" width="9" height="22" rx="2.5" fill="#19C2B4"/>
        <rect x="36" y="-6" width="9" height="26" rx="2.5" fill="#14C7A4"/>
      </g>
      <text x="600" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#DCEBFF">四级信任</text>
    </g>


    <!-- RIGHT: unified hero emblem (ring + bracket-shield + check) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="5s" repeatCount="indefinite"/>

      <!-- ring: ripple + lens; trust nodes + plugin tab pulse -->
      <circle cx="1000" cy="180" r="140" fill="none" stroke="url(#ds)" stroke-width="13"/>
      <circle cx="1000" cy="40"  r="10" fill="#2FE0B6"><animate attributeName="r" values="8;12;8" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="180" r="10" fill="#2E6BFF"><animate attributeName="r" values="8;12;8" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle>
